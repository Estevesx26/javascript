<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex009</title>
</head>
<body>
    <h1>Teste sua nacionalidade!</h1>
    <label for="nac">Nacionalidade: </label>
    <input type="text" name="nacionalidade" id="nac">
    <input type="button" value="Verificar" onclick="clicar()">

    <div id="res">
        
    </div>
    
    <script>
        function clicar(){
            var n = window.document.getElementById('nac').value
            var r = window.document.getElementById('res')

            if (n == 'brasileiro'){
                r.innerText = `Você é ${n}`
            } else {
                r.innerText = `Você é estrangeiro`
            }
        }
    </script>

</html>
