<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            font-family: Arial, Helvetica, sans-serif;
        }

        #layout {
            background-color: rgb(95, 173, 242);

            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        h1 {
            color: white;
            margin-bottom: 20px;
        }

        #container {
            background-color: white;

            padding: 20px;
            margin-bottom: 20px;
            border-radius: 20px;

            height: auto;
        }

        div {
            margin-bottom: 15px;
        }

        button {
            padding: 5px;
            border-radius: 8px;
            background-color: lightslategray;
            color: white;
        }

        #title {
            margin-bottom: 10px;
        }

        #container-txt-img {
            display: none;
        }

        .txt-img {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;

        }

        #txt {
            margin-bottom: 20px;
        }

        #img {
            background-image: url();
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;

            height: 200px;
            width: 200px;

            border-radius: 50%;
        }
    </style>
</head>

<body>
    <main id="layout">

        <h1>Verificador de idade</h1>

        <section id="container">
            <form>
                <div class="data">
                    <label for="ano">Ano de Nascimento: </label>
                    <input type="number" name="ano" id="ano" required>
                </div>


                <div class="sexo-masculino-feminino">
                    <span>Sexo:</span>
                    <label for="masculino">
                        <input type="radio" name="sexo" id="masculino" required>
                        Masculino:
                    </label>
                    <label for="feminino">
                        <input type="radio" name="sexo" id="feminino" required>
                        Feminino:
                    </label>
                </div>

                <div class="btn">
                    <button type="button" onclick="clicar()">Verificar</button>
                </div>
            </form>

            <p id="title">Preencha os dados acima para ver o resultado!</p>

            <div id="container-txt-img">
                <div class="txt-img">
                    <p id="txt"></p>
                    <div id="img">
                    </div>
                </div>
            </div>
        </section>

        <p><i>@CursoemVídeo</i></p>
    </main>

    <script>
        function clicar() {
            var n1 = document.getElementById('ano')
            var m = document.getElementById('masculino')
            var f = document.getElementById('feminino')

            var title = document.getElementById('title')
            var container = document.getElementById('container-txt-img')
            var txt = document.getElementById('txt')
            var img = document.getElementById('img')

            var ano = new Date()
            var n2 = ano.getFullYear()

            var nascimento = Number(n1.value)
            var idade = n2 - nascimento

            if(idade >=0 && idade <= 13 && m.checked){
                container.style.display = 'block'
                img.style.backgroundImage = "url('img/crianca-m.jpg')"
                title.innerHTML = `Detectamos uma criança (H) com ${idade} anos.`
            } else if(idade > 13 && idade <=24 && m.checked){
                container.style.display = 'block'
                img.style.backgroundImage = "url('img/jovem-m.jpg')"
                title.innerHTML = `Detectamos um jovem (H) com ${idade} anos.`
            } else if(idade > 24 && idade <=59 && m.checked){
                container.style.display = 'block'
                img.style.backgroundImage = "url('img/homem-m.jpg')"
                title.innerHTML = `Detectamos um homem (H) com ${idade} anos.`
            } else if(idade > 59 && m.checked){
                container.style.display = 'block'
                img.style.backgroundImage = "url('img/idoso-m.jpg')"
                title.innerHTML = `Detectamos um idoso (H) com ${idade} anos.`
            } else if(idade > 0 && idade <=13 && f.checked){
                container.style.display = 'block'
                img.style.backgroundImage = "url('img/crianca-f.jpg')"
                title.innerHTML = `Detectamos uma criança (F) com ${idade} anos.`
            } else if(idade > 13 && idade <=24 && f.checked){
                container.style.display = 'block'
                img.style.backgroundImage = "url('img/jovem-f.jpg')"
                title.innerHTML = `Detectamos uma mulher (F) com ${idade} anos.`
            } else if(idade > 24 && idade <=59 && f.checked){
                container.style.display = 'block'
                img.style.backgroundImage = "url('img/mulher-f.jpg')"
                title.innerHTML = `Detectamos uma mulher (F) com ${idade} anos.`
            } else if(idade > 59 && f.checked){
                container.style.display = 'block'
                img.style.backgroundImage = "url('img/idosa-f.jpg')"
                title.innerHTML = `Detectamos uma idosa (F) com ${idade} anos.`
            } else if(nascimento > n2){
                title.innerHTML ='ERRO: Data Inválida!'
            }

        }
    </script>
</body>

</html>
