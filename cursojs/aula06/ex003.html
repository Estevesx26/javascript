<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Primeiro Programa JS</title>
    <style>
        body{
            background-color: rgb(255, 0, 0);
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }

        h1{
            color: yellow;
        }
    </style>
</head>
<body>
    <h1>Hello, word!</h1>
    <p>Já me livrei da maldição</p>

    <script>
        var nome = window.prompt('Olá, qual é seu nome ?')
        window.alert('Seja muito bem vindo, ' + nome + ' !')

        var n1 = Number(window.prompt('Digite um número !'))
        var n2 = Number(window.prompt('Digite outro número !'))
        var soma = Number(n1) + Number(n2)

        window.alert(`A soma do(a) ${nome} entre ${n1} e ${n2} é igual a ${soma}`)
    </script>

</body>
</html>
