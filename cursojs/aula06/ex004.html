<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    

    <script>
        var nome = window.prompt('Olá, qual é seu nome ?')
        document.write(`O seu nome tem ${nome.length} carácteres <br/>`)
        document.write(`Seu nome <strong>"${nome}"</strong>, com as letras maiúsculas, fica assim: <strong>${nome.toUpperCase()}</strong> <br/>`)
        document.write(`Seu nome <strong>"${nome}"</strong>, com as letras minúsculas, fica assim: <strong>${nome.toLowerCase()}</strong> <br/>`)
    </script>
</body>
</html>
