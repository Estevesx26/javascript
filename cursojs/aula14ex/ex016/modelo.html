<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>desafio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Vamos Contar</h1>

        <div class="caixa">
            <div class="containers">
                <label for="inicio">Início: </label>
                <input type="number" name="inicio" id="inicio" placeholder="Numero Inicial">
            </div>

            <div class="containers">
                <label for="fim">Fim: </label>
                <input type="number" name="fim" id="fim" placeholder="Numero Final">
            </div>

            <div class="containers">
                <label for="passo">Passo: </label>
                <input type="number" name="passo" id="passo" placeholder="Ex: 1,2,3...">
            </div>       

            <div class="enter"><input id="btn" type="button" value="Contar" onclick="clicar()"></div>

            <span id="txt">
                Faça sua conta !
            </span>

            <span id="txt-res">
                
            </span>
        </div>

        <p>@ CursoemVídeo</p>
    </main>

    <script src="modelo.js"></script>
</body>
</html>
